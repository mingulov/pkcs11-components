name: Staging publishing probe

on:
  push:
    branches: ["**"]
    paths: ["tools/publish-probe/**", "scripts/**", ".cargo/config.toml", ".github/workflows/publish-staging.yml"]
  pull_request:
    paths: ["tools/publish-probe/**", "scripts/**", ".cargo/config.toml", ".github/workflows/publish-staging.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run, first upload with a staging API token, or trusted publishing
        required: true
        default: dry-run
        type: choice
        options: [dry-run, bootstrap, trusted]

permissions:
  contents: read

concurrency:
  group: crates-io-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Package the dependency-free staging probe
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - name: Require main for an actual upload
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'dry-run'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Generate a unique staging-only package
        run: python3 scripts/release_checks.py staging-probe --destination "$RUNNER_TEMP/staging-probe" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Dry-run against the staging registry
        run: cargo publish --manifest-path "$RUNNER_TEMP/staging-probe/Cargo.toml" --registry staging --dry-run

  publish:
    name: Publish probe to staging.crates.io
    needs: dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'dry-run'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: crates-io-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/release_checks.py staging-probe --destination "$RUNNER_TEMP/staging-probe" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Check initial-publication credential
        if: inputs.mode == 'bootstrap'
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$BOOTSTRAP_TOKEN" ]; then
            echo 'Set a staging token as CARGO_REGISTRY_BOOTSTRAP_TOKEN in the crates-io-staging environment.' >&2
            exit 1
          fi
      - name: Authenticate with staging using OIDC
        if: inputs.mode == 'trusted'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        with:
          url: https://staging.crates.io
      - name: Upload the staging-only probe
        env:
          CARGO_REGISTRIES_STAGING_TOKEN: ${{ inputs.mode == 'bootstrap' && secrets.CARGO_REGISTRY_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --manifest-path "$RUNNER_TEMP/staging-probe/Cargo.toml" --registry staging
