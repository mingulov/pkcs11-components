name: Publish crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run, first upload with an API token, or trusted publishing
        required: true
        default: dry-run
        type: choice
        options: [dry-run, bootstrap, trusted]
      package:
        description: Use an individual package only to recover a verified partial publication
        required: true
        default: workspace
        type: choice
        options: [workspace, pkcs11-abi, pkcs11-module, pkcs11-types]

permissions:
  contents: read

concurrency:
  group: crates-io-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag and main ancestry
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/release_checks.py preflight --ref "$GITHUB_REF" --require-main

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the verified tag
    needs: [preflight, ci]
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'dry-run'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - name: Recheck the exact checkout before requesting credentials
        run: |
          python3 scripts/release_checks.py preflight --ref "$GITHUB_REF" --require-main
          cargo +1.98.0 publish --workspace --locked --dry-run --registry crates-io
      - name: Check initial-publication credential
        if: inputs.mode == 'bootstrap'
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$BOOTSTRAP_TOKEN" ]; then
            echo 'Set CARGO_REGISTRY_BOOTSTRAP_TOKEN in the crates-io environment for the first publication.' >&2
            exit 1
          fi
      - name: Authenticate with crates.io using OIDC
        if: inputs.mode == 'trusted'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.mode == 'bootstrap' && secrets.CARGO_REGISTRY_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: |
          case "$RELEASE_PACKAGE" in
            workspace) selection=(--workspace) ;;
            pkcs11-abi|pkcs11-module|pkcs11-types) selection=(-p "$RELEASE_PACKAGE") ;;
            *) echo 'Invalid package selection' >&2; exit 1 ;;
          esac
          cargo +1.98.0 publish --locked --registry crates-io "${selection[@]}"
      - name: Verify a fresh consumer from production crates.io
        if: inputs.package == 'workspace'
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tempfile, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          with tempfile.TemporaryDirectory(prefix='registry-consumer-') as directory:
              root = pathlib.Path(directory)
              (root / 'src').mkdir()
              manifest = '[package]\nname="registry-consumer"\nversion="0.0.0"\nedition="2024"\nrust-version="1.88"\n[dependencies]\n'
              for name in ('pkcs11-abi', 'pkcs11-module', 'pkcs11-types'):
                  manifest += f'{name}="={version}"\n'
              (root / 'Cargo.toml').write_text(manifest)
              (root / 'src/main.rs').write_text('''
          fn main() {
              assert_eq!(pkcs11_abi::function_name(103), Some("C_UnwrapKeyAuthenticated"));
              assert_eq!(pkcs11_module::table_bytes(pkcs11_module::LinuxLayout::Ilp32, 104), Ok(420));
              let registry = pkcs11_types::MechanismRegistry::load(None).unwrap();
              assert_eq!(registry.param_shape(pkcs11_types::CkMechanismType::AES_GCM.0), Some("gcm"));
          }
          ''')
              subprocess.run(['cargo', '+1.88.0', 'run', '--manifest-path', str(root / 'Cargo.toml')], check=True)
          PY
