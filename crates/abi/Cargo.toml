[package]
name = "pkcs11-abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PKCS#11 function-table layouts, catalogs, selection, and readers"
readme = "README.md"
documentation = "https://docs.rs/pkcs11-abi"
keywords = ["pkcs11", "cryptoki", "abi", "hsm", "no-std"]
categories = ["cryptography", "hardware-support", "no-std"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[features]
default = ["native"]
native = ["dep:cryptoki-sys"]

[dependencies]
cryptoki-sys = { workspace = true, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
