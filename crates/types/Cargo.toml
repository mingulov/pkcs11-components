[package]
name = "pkcs11-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Rust PKCS#11 data types and mechanism metadata"
readme = "README.md"
documentation = "https://docs.rs/pkcs11-types"
keywords = ["pkcs11", "cryptoki", "hsm", "mechanism", "attributes"]
categories = ["cryptography", "data-structures"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
cryptoki-sys = { workspace = true }
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "allow"
