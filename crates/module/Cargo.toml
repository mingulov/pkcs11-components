[package]
name = "pkcs11-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw pre-initialization PKCS#11 module interface acquisition"
readme = "README.md"
documentation = "https://docs.rs/pkcs11-module"
keywords = ["pkcs11", "cryptoki", "hsm", "module"]
categories = ["cryptography", "hardware-support"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[features]
default = ["native"]
native = ["pkcs11-abi/native", "dep:cryptoki-sys", "dep:libloading"]

[dependencies]
pkcs11-abi = { workspace = true }
cryptoki-sys = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[[example]]
name = "inspect"
required-features = ["native"]
